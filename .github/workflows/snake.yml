name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # Executa diariamente à meia-noite UTC
  push:
    branches:
      - main
  workflow_dispatch: # Permite execução manual pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate Snake Animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: JVRicci
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#00FF00&color_dots=#0d1117,#30363d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00FF00&color_dots=#0d1117,#30363d

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output

